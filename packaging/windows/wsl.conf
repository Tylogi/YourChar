# YourChar WSL2 runtime configuration.
#
# Applied by WSL when this distribution starts. Keeping it in the image means
# the end user never configures a distribution by hand.

[boot]
systemd=false

[user]
default=yourchar

[network]
generateResolvConf=true

[interop]
enabled=true
# Keep the Windows PATH out of the Linux runtime: the backend must always use
# the Node and Python that ship in this distribution.
appendWindowsPath=false