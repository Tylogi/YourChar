<script>
const paths={spark:'M12 3 14.5 9.5 21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z',panel:'M3 4h18v16H3Z M9 4v16',new:'M12 3H4v17h17v-8 M14 6h8 M18 2v8 M8 8h2 M8 12h7',search:'M21 21l-5-5 M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0',people:'M9 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M2 21v-3a7 7 0 0 1 14 0v3 M17 4a3 3 0 0 1 0 6 M18 13a5 5 0 0 1 4 5v3',calendar:'M4 5h16v15H4Z M8 3v4 M16 3v4 M4 10h16 M8 14h2 M14 14h2',chat:'M4 4h16v12H9l-5 4Z',world:'M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0 M3 12h18 M12 3c5 5 5 13 0 18-5-5-5-13 0-18',down:'m6 9 6 6 6-6',right:'m9 6 6 6-6 6',blocks:'M3 3h7v7H3Z M14 3h7v7h-7Z M3 14h7v7H3Z M14 14h7v7h-7Z',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M12 2v3 M12 19v3 M2 12h3 M19 12h3 M5 5l2 2 M17 17l2 2 M5 19l2-2 M17 7l2-2',moon:'M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10Z',info:'M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0 M12 11v6 M12 7h.01',more:'M5 12h.01 M12 12h.01 M19 12h.01',check:'m5 12 4 4L19 6',copy:'M9 9h12v12H9Z M5 15H3V3h12v2',thumb:'M7 10v11H3V10Z M7 10l5-8h2v8h6v9l-2 2H7',retry:'M3 10a9 9 0 1 1 1 8 M3 3v7h7',plus:'M12 5v14 M5 12h14',up:'M12 19V5 M5 12l7-7 7 7',sliders:'M4 7h5 M15 7h5 M9 4v6 M4 17h11 M19 17h1 M15 14v6',lock:'M5 10h14v11H5Z M8 10V6a4 4 0 0 1 8 0v4',gauge:'M4 19a10 10 0 1 1 16 0 M12 12l5-5 M8 19h8',pin:'M12 22s8-8 8-14a8 8 0 1 0-16 0c0 6 8 14 8 14Z M15 8a3 3 0 1 1-6 0 3 3 0 0 1 6 0',eye:'M3 3l18 18 M10 5c7-2 12 7 12 7l-3 4 M6 6C3 8 1 12 1 12s6 9 14 6 M10 10l4 4',archive:'M3 3h18v5H3Z M5 8v13h14V8 M9 12h6',edit:'m4 16 12-12 4 4L8 20H4Z M14 6l4 4',memory:'M12 5v16 M12 5C8 2 3 3 3 3v16s5-1 9 2c4-3 9-2 9-2V3s-5-1-9 2Z',close:'m6 6 12 12 M6 18 18 6',file:'M5 3h9l5 5v13H5Z M14 3v6h5'};
const icon=(k,extra='')=>`<svg class="icon ${extra}" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[k]||paths.spark}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function icons(root=document){root.querySelectorAll('[data-icon]').forEach(e=>e.innerHTML=icon(e.dataset.icon))}
const threads=[{id:'lin',title:'整理下午的安排',owner:'林澈',mode:'private',time:'刚刚',sub:'提醒、论文和一点休息时间'}, {id:'su',title:'最近读到的一句话',owner:'苏晚',mode:'private',time:'1 小时',sub:'文字与日常的小事'}, {id:'alex',title:'研究计划怎么往下推进',owner:'Alex',mode:'private',time:'昨天',sub:'把目标拆成下一步'}, {id:'world',title:'街角书店',owner:'青岚市',mode:'world',time:'今天',sub:'林澈、苏晚 · 午后小雨'}, {id:'interaction',title:'林澈与苏晚的互动',owner:'青岚市',mode:'world',time:'',sub:'共同世界中的角色交流',child:true}];
let current=threads[0],page='thread',drafts={},messages={},files=[],newCount=0,collapsed=new Set(),query='',tools={memory:true,schedule:true},privacy=false;
function list(){let html='';for(const [key,label,set] of [['private','角色私聊',threads.filter(t=>t.mode==='private')],['world','世界会话',threads.filter(t=>t.mode==='world')]]){html+=`<section class="group"><button class="group-label" data-group="${key}" aria-expanded="${!collapsed.has(key)}">${icon(collapsed.has(key)?'right':'down')}${label}<span class="count">${key==='world'?'青岚市':set.length}</span></button><div ${collapsed.has(key)?'hidden':''}>${set.map(t=>`<button class="session ${current.id===t.id&&page==='thread'?'active':''} ${t.child?'child':''}" data-thread="${t.id}" aria-current="${current.id===t.id&&page==='thread'?'page':'false'}">${icon(t.mode==='world'?'world':'chat')}<span class="session-copy"><strong>${esc(t.title)}</strong>${!t.child?`<small>${esc(t.mode==='private'?t.owner:t.sub)}</small>`:''}</span><time>${t.time}</time></button>`).join('')}</div></section>`}document.querySelector('#thread-list').innerHTML=html}
function footer(){return `<div class="response-footer"><span class="identity">${esc(current.owner)}</span><span class="divider"></span><button class="icon-button" data-feedback="copy" aria-label="复制回复">${icon('copy')}</button><button class="icon-button" data-feedback="like" aria-label="认可回复">${icon('thumb')}</button><span class="complete">已完成</span></div>`}
function initial(){if(current.new)return `<section class="empty-chat">${icon('spark')}<h1>今天，从哪里开始？</h1><p>和 ${esc(current.owner)} 聊聊，也可以一起完成一件事。</p><div class="quick-starts"><button data-prompt="帮我理一下今天的安排">理一下今天的安排</button><button data-prompt="想聊聊最近的想法">聊聊最近的想法</button><button data-start-world>进入共同世界</button></div></section>`;if(current.mode==='world')return `<div class="narrative-kicker">青岚市 / 第 12 次共同经历</div><h1 class="scene-heading">街角书店</h1><div class="scene-context"><span>午后 14:10 · 小雨</span><span>在场：林澈、苏晚</span></div><article class="world-message"><p>推开书店的玻璃门，风铃轻轻响了一声。雨水沿着窗沿往下滑，店里有旧纸页和刚煮好咖啡的气味。</p><p>林澈把伞收好，靠在门边。苏晚站在靠窗的书架前，指尖停在一本浅灰色的书脊上。</p><div class="spoken"><strong>苏晚</strong><p>“就是这本。上次想和你们说的，开头有一句话特别好。”</p></div><p>她把书抽出来，翻到折了角的那一页，转向你。窗外的雨声恰好在这时变轻了一点。</p><div class="spoken"><strong>林澈</strong><p>“不急，坐下来慢慢看。今天应该还会下很久。”</p></div><div class="world-end">${icon('memory')}世界记录 · 示例<span style="margin-left:auto">轮到你继续这个场景</span></div></article>${footer()}`;if(current.id==='lin')return `<div class="date-line"><span>今天 · 10:24</span><span>角色私聊</span></div><div class="user-message"><p>下午想读论文，但最近有点坐不住。帮我把安排理一下，三点半提醒我起来走走。</p></div><details class="execution"><summary>${icon('check')}已完成 2 个步骤 ${icon('right','chevron')}</summary><div class="steps"><div class="step"><span>读取当前时间与日程</span><span>schedule.read</span></div><div class="step"><span>创建 15:30 休息提醒</span><span>schedule.create</span></div><div class="step-note">执行过程示例，未创建真实提醒。</div></div></details><article class="assistant-message"><p class="lead">可以。下午先留一段完整的时间给论文，其他事情放到后面。<br>不必一口气读很多，先把一篇的思路弄清楚就好。</p><h2>下午这样安排</h2><div class="schedule-lines"><div class="schedule-line"><time>14:00 – 15:20</time><div><b>读一篇论文，记下关键问题</b><small>先看摘要和结论，再围绕最感兴趣的部分深入。</small></div></div><div class="schedule-line"><time>15:20 – 15:30</time><div><b>收一下笔记</b><small>写下三点收获，留一个明天可以继续的问题。</small></div></div><div class="schedule-line"><time>15:30</time><div><b>起来走走</b><small>暂时离开屏幕，给注意力一点恢复的时间。</small></div></div></div><div class="inline-result">${icon('check')}15:30 的休息提醒已安排。<span class="demo">状态演示</span></div><p>如果还是坐不住，就先读 20 分钟。开始得小一点也没关系。</p></article>${footer()}`;return `<div class="date-line">${current.time} · 角色私聊</div><div class="user-message">${current.id==='su'?'最近有点想慢下来，又怕自己浪费时间。':'想把这周的研究任务重新梳理一下。事情太多，不知道先做哪个。'}</div><article class="assistant-message"><p>${current.id==='su'?'慢下来不一定是在浪费时间。有时候，是在给自己留一点重新感受生活的空间。':'先不用把所有事情重新排一遍。找出本周最想推进的一个目标，再看其他任务和它有没有关系。'}</p><p>${current.id==='su'?'今天可以先做一件没有明确产出的事：读几页喜欢的书，出门走一小段路，或者只是在这里聊一会儿。':'我们可以先列三件事：最重要的结果、目前最大的阻碍，以及今天就能开始的一个动作。'}</p><p>${current.id==='su'?'你最想暂时放下的，是哪一件事？':'你希望这周结束的时候，最关键的哪件事有所不同？'}</p></article>${footer()}`}
function updateHeader(){document.querySelector('#thread-title').textContent=current.title;document.querySelector('#thread-owner').textContent=current.owner;document.querySelector('#title-slash').hidden=false;document.querySelector('#thread-owner').hidden=false;document.querySelector('#selected-role').textContent=current.mode==='world'?'青岚市':current.owner;document.querySelector('#selected-mode').textContent=current.mode==='world'?'世界':'私聊';document.querySelector('#input-context').textContent=current.mode==='world'?'世界演绎':'角色私聊';document.querySelector('#input').placeholder=current.mode==='world'?'继续这个场景…':`继续对话，或交给${current.owner}一件事…`;document.querySelector('#inspector-toggle').disabled=false}
function saveDraft(){drafts[current.id]=document.querySelector('#input').value}
function selectThread(id){saveDraft();current=threads.find(t=>t.id===id)||threads[0];page='thread';document.querySelector('#workspace').hidden=false;document.querySelector('#content-page').hidden=true;document.querySelectorAll('[data-page]').forEach(b=>b.classList.remove('active'));document.querySelector('#reading').innerHTML=current.id.startsWith('new-')&&!current.new?'':initial();for(const m of messages[current.id]||[])append(m.role,m.text,false);document.querySelector('#input').value=drafts[current.id]||'';files=[];renderFiles();privacy=false;document.querySelector('#notice').hidden=true;hideMenus();closeMobile();updateHeader();renderInspector();list();document.querySelector('#scroll').scrollTop=0;}
function startNew(){saveDraft();const id=`new-${++newCount}`;threads.unshift({id,title:'新对话',owner:'林澈',mode:'private',time:'刚刚',sub:'',new:true});selectThread(id);document.querySelector('#input').focus()}
function append(role,text,save=true){const reading=document.querySelector('#reading');reading.querySelector('.empty-chat')?.remove();const el=document.createElement(role==='user'?'div':'article');el.className=role==='user'?'user-message':'assistant-message';const p=document.createElement('p');p.textContent=text;p.style.whiteSpace='pre-wrap';el.append(p);reading.append(el);if(role==='assistant'){const f=document.createElement('div');f.innerHTML=footer();reading.append(f.firstElementChild)}if(save)(messages[current.id]??=[]).push({role,text})}
function send(text){const value=(typeof text==='string'?text:document.querySelector('#input').value).trim();if(!value&&!files.length)return;const content=(value||'分享附件')+(files.length?'\n附件：'+files.map(f=>f.name).join('、'):'');if(current.new){current.title=value.slice(0,20)||'分享附件';current.new=false;updateHeader();list()}append('user',content);append('assistant',current.mode==='world'?'你继续了这个场景。这是界面演示；接入世界模型后，故事会结合在场角色与历史继续展开。':`${current.owner}：收到。这是交互原型，当前回复为演示内容。正式版本会结合角色设定、记忆和可用工具继续处理。`);document.querySelector('#input').value='';drafts[current.id]='';files=[];renderFiles();const s=document.querySelector('#scroll');s.scrollTop=s.scrollHeight}
function renderFiles(){document.querySelector('#attachment-list').innerHTML=files.map((f,i)=>`<div class="attachment">${icon('file')}<span>${esc(f.name)}</span><button type="button" data-remove="${i}" aria-label="移除附件">×</button></div>`).join('')}
function hideMenus(){document.querySelector('#popover').hidden=true;document.querySelector('#top-menu').hidden=true;for(const id of ['more','role-select','mode-select','tools-select'])document.getElementById(id).setAttribute('aria-expanded','false')}
function popover(kind){const box=document.querySelector('#popover');if(!box.hidden&&box.dataset.kind===kind){hideMenus();return}hideMenus();box.dataset.kind=kind;box.hidden=false;document.querySelector(`#${kind}-select`).setAttribute('aria-expanded','true');box.innerHTML=kind==='role'?`<div class="pop-label">选择当前角色</div>${['林澈','苏晚','Alex'].map(n=>`<button type="button" data-role="${n}">${icon('people')}${n}<small>${current.owner===n?'当前':''}</small></button>`).join('')}`:kind==='mode'?`<div class="pop-label">会话类型</div><button type="button" data-mode="private">${icon('chat')}角色私聊</button><button type="button" data-mode="world">${icon('world')}世界演绎<small>青岚市</small></button>`:`<div class="pop-label">本次演示的能力开关</div><button type="button" data-tool="memory">${icon('memory')}长期记忆<small>${tools.memory?'已启用':'已关闭'}</small></button><button type="button" data-tool="schedule">${icon('calendar')}日程与提醒<small>${tools.schedule?'已启用':'已关闭'}</small></button>`}
function renderInspector(){document.querySelector('#inspector').innerHTML=`<div class="inspector-head">会话资料<button class="icon-button" id="close-inspector" aria-label="关闭资料">${icon('close')}</button></div><h2>${esc(current.owner)}</h2><p>${current.mode==='world'?'青岚市，街角书店。林澈与苏晚正在一场午后的小雨里翻阅旧书。':'在日常交流之外，也可以一起整理安排、处理任务，延续共同记忆。'}</p><div class="inspect-row"><span>会话</span><span>${current.mode==='world'?'世界演绎':'角色私聊'}</span></div><div class="inspect-row"><span>上下文</span><span>24% · 示例</span></div><div class="inspect-section"><h3>${current.mode==='world'?'当前场景':'相关记忆'}</h3><div class="inspect-memory">${current.mode==='world'?'地点：街角书店<br>时间：14:10，小雨<br>在场：林澈、苏晚':'你喜欢在下午安排需要专注的工作。'}</div><div class="inspect-memory">${current.mode==='world'?'角色的言行与世界历史会共同影响后续叙事。':'忙碌的时候，也想留一点不被打扰的时间。'}</div><button class="inspect-link" data-page="management">查看记忆与能力</button></div><div class="inspect-section"><h3>能力</h3><div class="inspect-row"><span>长期记忆</span><span>${tools.memory?'已启用':'已关闭'}</span></div><div class="inspect-row"><span>日程与提醒</span><span>${tools.schedule?'已启用':'已关闭'}</span></div></div>`;document.querySelector('#close-inspector').onclick=()=>inspector(false)}
function inspector(open){const node=document.querySelector('#inspector');const show=typeof open==='boolean'?open:node.hidden;node.hidden=!show;document.querySelector('#inspector-toggle').setAttribute('aria-expanded',String(show))}
function showPage(id){saveDraft();page=id;hideMenus();closeMobile();document.querySelector('#workspace').hidden=true;document.querySelector('#content-page').hidden=false;document.querySelector('#notice').hidden=true;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===id));const titles={search:'搜索',characters:'角色与世界',calendar:'日程',management:'记忆与能力',settings:'设置'};document.querySelector('#thread-title').textContent=titles[id];document.querySelector('#thread-owner').hidden=true;document.querySelector('#title-slash').hidden=true;document.querySelector('#inspector-toggle').disabled=true;const sub={search:'搜索当前原型里的角色、世界和会话。',characters:'选择角色开始私聊，或进入一个共同世界。',calendar:'把日程安排与角色日常分开查看。',management:'记忆、工具与工作空间，按需要管理。',settings:'调整外观与会话偏好。以下为独立原型设置。'};let html=`<h1>${titles[id]}</h1><p class="page-sub">${sub[id]}</p>`;if(id==='search')html+=`<label class="search-box">${icon('search')}<input id="search-input" aria-label="搜索会话" placeholder="输入名称或会话内容…"></label><div id="search-results"></div>`;else if(id==='characters')html+=`<nav class="plain-tabs"><button class="active" data-library="private">角色</button><button data-library="world">世界</button></nav><div id="library"></div>`;else if(id==='calendar')html+=`<nav class="plain-tabs"><button class="active" data-calendar="user">用户日程</button><button data-calendar="character">角色日程</button></nav><div id="agenda"></div>`;else if(id==='management')html+=[['memory','长期记忆','下午的专注习惯、想给自己留一点空白。','2 条示例'],['blocks','MCP 与 Skills','角色可用的工具与工作方法。','2 项能力'],['archive','工作空间','文档、附件与项目文件。','未连接']].map(([i,n,s,label])=>row(i,n,s,label)).join('');else html+=`<div class="plain-row">${icon('moon')}<div><strong>外观</strong><p>黑白灰，跟随本次选择。</p></div><button id="settings-theme">切换深浅</button></div>${row('people','模型与角色路由','沿用现有产品的模型配置方式。','配置入口')}${row('eye','私密与无痕','这里只展示入口，不实现数据隔离。','原型')}<div class="plain-row">${icon('info')}<div><strong>关于这版设计</strong><p>内容优先、单侧栏、单列正文，保留 YourChar 的角色与世界结构。</p></div><button id="about-design">查看</button></div>`;document.querySelector('#page-content').innerHTML=html;if(id==='search'){document.querySelector('#search-input').value=query;searchResults();document.querySelector('#search-input').oninput=e=>{query=e.target.value;searchResults()};document.querySelector('#search-input').focus()}if(id==='characters')library('private');if(id==='calendar')agenda('user');document.querySelector('#settings-theme')?.addEventListener('click',toggleTheme);document.querySelector('#about-design')?.addEventListener('click',()=>dialog('简约工作台','<p>将功能导航与会话合并在一个侧栏。助手回复直接排版，工具执行折叠展开；会话资料作为可选侧面板。</p><p>这是一版独立设计原型，借鉴 agent 工作台的简洁方向。未连接真实模型或数据。</p><p>参考入口：<a href="https://developers.openai.com/codex/app/" target="_blank" rel="noreferrer">Codex app</a> · <a href="https://chat.deepseek.com/" target="_blank" rel="noreferrer">DeepSeek</a></p>'));list()}
function row(i,n,s,label){return `<div class="plain-row">${icon(i)}<div><strong>${n}</strong><p>${s}</p></div><small>${label}</small></div>`}
function searchResults(){const result=threads.filter(t=>`${t.title} ${t.owner} ${t.sub}`.toLowerCase().includes(query.toLowerCase().trim()));document.querySelector('#search-results').innerHTML=result.length?result.map(t=>`<button class="plain-row" data-thread="${t.id}">${icon(t.mode==='world'?'world':'chat')}<div><strong>${esc(t.title)}</strong><p>${esc(t.owner)} · ${esc(t.sub)}</p></div><small>打开</small></button>`).join(''):'<div class="empty-message">没有找到匹配会话。</div>'}
function library(mode){document.querySelector('#library').innerHTML=(mode==='private'?[['lin','林澈','日常交流、任务与安排'],['su','苏晚','文字、阅读与日常感受'],['alex','Alex','研究计划与工作协作']]:[['world','青岚市','街角书店 · 林澈与苏晚在场']]).map(([id,n,s])=>`<button class="plain-row" data-thread="${id}">${icon(mode==='private'?'people':'world')}<div><strong>${n}</strong><p>${s}</p></div><small>进入 ${icon('right')}</small></button>`).join('')}
function agenda(owner){document.querySelector('#agenda').innerHTML=(owner==='user'?[['14:00','论文阅读','建议安排 · 专注完成一篇'],['15:30','起来走走','提醒状态示例 · 来自与林澈的私聊']]:[['09:00','林澈 · 整理今天的计划','角色日常 · 示例'],['14:00','苏晚 · 街角书店','世界日常 · 示例']]).map(([time,n,s])=>`<div class="plain-row"><time>${time}</time><div><strong>${n}</strong><p>${s}</p></div></div>`).join('')}
function dialog(title,html){document.querySelector('#dialog-content').innerHTML=`<h2>${title}</h2>${html}`;document.querySelector('#dialog').showModal()}
function action(name){hideMenus();if(name==='context')dialog('上下文余量','<div class="metric">24% <span style="font-size:12px;color:var(--muted)">已使用</span></div><div class="meter"><span></span></div><p>示例：约 31K / 128K tokens。<br>这里只展示运行信息的呈现方式。</p>');if(name==='privacy'){privacy=!privacy;document.querySelector('#notice').hidden=!privacy}if(name==='archive')dialog('归档会话','<p>没有归档的示例会话。正式产品可以在这里查看和恢复归档对话。</p>');if(name==='meet'){dialog('发起见面','<p>和当前角色进入一个共同场景。</p><button class="plain-row" id="enter-world">'+icon('world')+'<div><strong>青岚市 · 街角书店</strong><p>午后小雨，林澈与苏晚在场。</p></div></button>');document.querySelector('#enter-world').onclick=()=>{document.querySelector('#dialog').close();selectThread('world')}}if(name==='rename'){dialog('重命名会话','<p>只修改本次预览中的名称。</p><form id="rename-form"><input id="rename-input" aria-label="会话名称" maxlength="50"><button class="primary" type="submit">保存</button></form>');document.querySelector('#rename-input').value=current.title;document.querySelector('#rename-form').onsubmit=e=>{e.preventDefault();const value=document.querySelector('#rename-input').value.trim();if(value){current.title=value;list();updateHeader();document.querySelector('#dialog').close()}}}}
function toggleTheme(){document.body.classList.toggle('dark');try{localStorage.setItem('yourchar-harness-theme',document.body.classList.contains('dark')?'dark':'light')}catch{}}
function closeMobile(){document.querySelector('#app').classList.remove('mobile-open')}
function toast(text){const t=document.querySelector('#toast');t.textContent=text;t.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.hidden=true,2500)}
document.addEventListener('click',e=>{const thread=e.target.closest('[data-thread]');if(thread){selectThread(thread.dataset.thread);return}const pageButton=e.target.closest('[data-page]');if(pageButton){showPage(pageButton.dataset.page);return}const group=e.target.closest('[data-group]');if(group){const id=group.dataset.group;collapsed.has(id)?collapsed.delete(id):collapsed.add(id);list();return}const act=e.target.closest('[data-action]');if(act){action(act.dataset.action);return}const role=e.target.closest('[data-role]');if(role){const name=role.dataset.role;if(current.new){current.owner=name;updateHeader();document.querySelector('#reading').innerHTML=initial();list();renderInspector();hideMenus()}else selectThread({林澈:'lin',苏晚:'su',Alex:'alex'}[name]);return}const mode=e.target.closest('[data-mode]');if(mode){selectThread(mode.dataset.mode==='world'?'world':'lin');return}const tool=e.target.closest('[data-tool]');if(tool){tools[tool.dataset.tool]=!tools[tool.dataset.tool];document.querySelector('#popover').hidden=true;popover('tools');renderInspector();return}const remove=e.target.closest('[data-remove]');if(remove){files.splice(Number(remove.dataset.remove),1);renderFiles();return}const tab=e.target.closest('[data-library],[data-calendar]');if(tab){tab.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===tab));if(tab.dataset.library)library(tab.dataset.library);else agenda(tab.dataset.calendar);return}const prompt=e.target.closest('[data-prompt]');if(prompt){document.querySelector('#input').value=prompt.dataset.prompt;document.querySelector('#input').focus();return}if(e.target.closest('[data-start-world]')){selectThread('world');return}const feedback=e.target.closest('[data-feedback]');if(feedback){if(feedback.dataset.feedback==='like'){feedback.style.color='var(--text)';toast('已标记认可 · 演示')}else{const prev=feedback.closest('.response-footer').previousElementSibling;const text=prev?.innerText||'';if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>toast('回复已复制')).catch(()=>toast('复制未获浏览器允许，请手动选择正文复制。'));else toast('请手动选择正文复制。')}return}if(!e.target.closest('#popover,#role-select,#mode-select,#tools-select,#more,#top-menu'))hideMenus()});
document.querySelector('#new-thread').onclick=startNew;document.querySelector('#collapse').onclick=()=>{if(matchMedia('(max-width:650px)').matches)closeMobile();else document.querySelector('#app').classList.add('side-collapsed')};document.querySelector('#expand').onclick=()=>{if(matchMedia('(max-width:650px)').matches)document.querySelector('#app').classList.add('mobile-open');else document.querySelector('#app').classList.remove('side-collapsed')};document.querySelector('#sidebar-backdrop').onclick=closeMobile;document.querySelector('#theme').onclick=toggleTheme;document.querySelector('#inspector-toggle').onclick=()=>inspector();document.querySelector('#more').onclick=()=>{const menu=document.querySelector('#top-menu');const open=menu.hidden;hideMenus();menu.hidden=!open;document.querySelector('#more').setAttribute('aria-expanded',String(open))};for(const kind of ['role','mode','tools'])document.querySelector(`#${kind}-select`).onclick=()=>popover(kind);document.querySelector('#composer').onsubmit=e=>{e.preventDefault();send()};document.querySelector('#input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}};document.querySelector('#attach').onclick=()=>document.querySelector('#files').click();document.querySelector('#files').onchange=e=>{files.push(...e.target.files);renderFiles();e.target.value=''};document.addEventListener('keydown',e=>{if(e.key==='Escape'){hideMenus();inspector(false);closeMobile()}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();showPage('search')}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='n'){e.preventDefault();startNew()}if((e.metaKey||e.ctrlKey)&&e.key===','){e.preventDefault();showPage('settings')}});try{if(localStorage.getItem('yourchar-harness-theme')==='dark')document.body.classList.add('dark')}catch{}icons();selectThread('lin');
</script>
</body>
</html>
