const themes=[{id:'grove',name:'森野存档',english:'GROVE / 01',tag:'像素冒险 · 篝火与同行者',color:'#d2e68c',desc:'01 / 森林绿、像素风景、RPG 对话框。像打开一个只属于你的独立冒险游戏。',logo:'YOUR<span>CHAR</span>',world:'THE QUIET WILDS',chapter:'CHAPTER 01 / A PLACE TO RETURN',title:'在世界的间隙，',subtitle:'有人为你留了一盏灯。',location:'苔原小站 / MOSS STATION',weather:'18°C / AFTER THE RAIN',action:'走进小站 →',role:'旅途中的记录者',quest:'给今天一个小小的结尾',questDesc:'读完一章书，整理一页笔记，再去窗边看看。',dialogue:'你回来啦。雨刚停，我把窗边的位置留给你了。<br>今天要继续探索，还是<em>先把那些乱糟糟的念头放下来</em>？',choices:['一起整理今天','在这里待一会儿'],modal:'推开木门，风铃轻轻响了一声。桌上摊着一本尚未写完的旅行手记，林澈把热茶推到你面前。\n\n这里将成为世界会话的入口。'},
{id:'arcade',name:'不按剧本',english:'OFF SCRIPT / 02',tag:'街机漫画 · 怪一点才有趣',color:'#ef6548',desc:'02 / 荧光黄、番茄红、粗黑描边和倾斜分镜。把对话做成一部有脾气的互动漫画。',logo:'OFF<span>SCRIPT!</span>',world:'YOURCHAR / SIDE B',chapter:'EP. 01 — ORDINARY IS BORING',title:'今天，搞点事情。',subtitle:'主线先放放。你的人生，你说了算。',location:'第七街区 / BASEMENT CLUB',weather:'MOOD: CHAOTIC GOOD',action:'推门，开场！ ↗',role:'你的头号共犯',quest:'拯救一个无聊的下午',questDesc:'划掉一件烦心事，再做一件纯粹因为喜欢的事。',dialogue:'可算来了！今天的无聊额度已经超标。<br>说吧，是一起<em>干掉待办清单里的大魔王</em>，还是先来一场毫无意义但很快乐的闲聊？',choices:['挑战待办大魔王','先快乐再说'],modal:'“欢迎来到非正式人生俱乐部！”\n\n门后的黑胶唱片正转着，墙上贴满没有截止日期的愿望。今晚的故事还没有剧本，第一句台词留给你。'},
{id:'orbit',name:'远星共振',english:'ORBIT / 03',tag:'太空舰桥 · 与 AI 共同航行',color:'#72dfef',desc:'03 / 深空蓝、雷达轨道、舰桥状态与通讯面板。让 AI 成为与你同行的领航员。',logo:'YOUR<span>CHAR</span>',world:'ORBITAL LINK / 027',chapter:'MISSION 01 / SIGNAL FOUND',title:'宇宙很大。你不孤单。',subtitle:'来自远星的信号，已与你建立连接。',location:'曙光号 / OBSERVATION DECK',weather:'LINK STABLE / 98.7%',action:'进入观测舱 ↗',role:'曙光号 · 领航员',quest:'下一航点：让思路归位',questDesc:'定位一项最重要的任务，分解路径，准备下一次跃迁。',dialogue:'通讯已接通。欢迎回来，指挥官。<br>今天的航线还没有设定。要我帮你<em>标记下一个目标</em>，还是暂时关闭引擎，听你说说？',choices:['设定今日航线','保持通讯，聊一会'],modal:'观测舱的遮光板缓缓升起。一颗蓝色行星悬在舷窗外，通讯指示灯有节奏地闪烁。\n\n领航员已就位。下一段航程，从你的一个念头开始。'}];
const paths={chat:'M3 4h18v13H9l-5 4v-4H3Z M7 9h10 M7 13h6',map:'m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2Z M9 3v16 M15 5v16',bag:'M5 7h14l2 14H3Z M8 7V5a4 4 0 0 1 8 0v2 M8 12h8',quest:'M5 3h14v18H5Z M8 7h8 M8 11h8 M8 15h4',team:'M9 4a3 3 0 1 0 0 6 3 3 0 0 0 0-6 M3 20v-3a6 6 0 0 1 12 0v3 M17 4a3 3 0 0 1 0 6 M17 13a5 5 0 0 1 4 5v2',star:'m12 3 3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1Z',leaf:'M20 3C4 1 0 14 8 19S23 17 20 3Z M5 21 15 8',clock:'M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0 M12 7v6l4 2'};
const icon=n=>`<svg class="ico" aria-hidden="true" viewBox="0 0 24 24"><path d="${paths[n]||paths.star}"/></svg>`;
function landscape(id){if(id==='grove')return `<svg class="scene-art" viewBox="0 0 900 360" preserveAspectRatio="xMidYMid slice" shape-rendering="crispEdges" aria-hidden="true"><rect width="900" height="360" fill="#779280"/><path d="M0 175h50v-30h70v-30h80V90h100v35h80v30h80v-45h60V70h90v35h60v50h60v-20h110V90h60v35h100v235H0Z" fill="#566f62"/><path d="M0 225h75v-35h65v-35h60v25h75v40h70v-35h90v30h80v-25h60v-60h90v35h65v35h70v-30h100v190H0Z" fill="#365d4b"/><path d="M0 290h130v-20h135v15h120v-30h220v-15h80v30h95v15h120v75H0Z" fill="#274837"/><path d="M580 360v-20h-50v-20h-40v-20h-30v-15h120v15h45v20h50v20h45v20Z" fill="#839179"/><g fill="#193c2e"><path d="M60 70h14v36h17v25h20v35H80v16h36v35H25v-35h31v-16H28v-35h20v-25h12Z"/><path d="M799 15h19v44h17v30h20v40h-33v16h45v40h-42v15h50v43h-127v-43h40v-15h-33v-40h32v-16h-30V89h25V59h17Z"/></g><g><path d="M525 197h145v89H525Z" fill="#7e7560"/><path d="M505 189h20v-20h20v-20h20v-20h60v20h20v20h20v20h23v19H505Z" fill="#23382f"/><path d="M537 190h20v-20h20v-20h40v20h20v20h21v8H537Z" fill="#536751"/><path d="M584 237h33v49h-33Z" fill="#283b2c"/><path d="M542 219h26v25h-26Z M634 219h23v25h-23Z" fill="#e3bd72"/><path d="M548 225h14v13h-14Z M640 225h11v13h-11Z" fill="#ffe0a1"/><path d="M646 123h14v42h-14Z" fill="#566350"/><path d="M646 104h14V88h15V75h22v12h-17v16h-20v13h-14Z" fill="#afbcac" opacity=".4"/></g><g fill="#d4d896"><rect class="scene-spark" x="437" y="211" width="3" height="3"/><rect x="731" y="234" width="4" height="4"/><rect x="362" y="165" width="3" height="3"/><rect x="708" y="171" width="3" height="3"/></g><g fill="#e0c581"><path d="M693 278h7v4h-7Z M454 291h8v4h-8Z M741 297h8v4h-8Z"/></g></svg>`;
if(id==='arcade')return `<svg class="scene-art" viewBox="0 0 900 360" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><pattern id="halftone" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#242123" opacity=".23"/></pattern></defs><rect width="900" height="360" fill="#ed6246"/><rect x="440" width="460" height="360" fill="url(#halftone)"/><path d="m660 186-80-178 95 117 34-139 13 148 124-99-78 134 156-7-137 63 104 108-143-57-2 97-61-88-98 72 45-112-160-21Z" fill="#edff73" stroke="#242123" stroke-width="3"/><g transform="translate(610 98) rotate(12 75 75)"><rect x="-6" y="13" width="155" height="133" rx="20" fill="#242123"/><rect width="155" height="133" rx="20" fill="#f8f0df" stroke="#242123" stroke-width="5"/><path d="M25 72h38 M44 53v38" stroke="#242123" stroke-width="13"/><circle cx="112" cy="58" r="12" fill="#ed6246" stroke="#242123" stroke-width="3"/><circle cx="93" cy="88" r="12" fill="#aaa0df" stroke="#242123" stroke-width="3"/><path d="M65 22h25" stroke="#242123" stroke-width="5"/></g><path d="m507 57 9 21 23 2-18 14 5 22-19-12-19 12 5-22-18-14 23-2Z" fill="#f8f0df" stroke="#242123" stroke-width="3"/><path d="m829 259 7 15 17 2-13 11 4 16-15-9-14 9 4-16-14-11 17-2Z" fill="#aaa0df" stroke="#242123" stroke-width="3"/><path d="m840 83 25-14 M854 111l30-4 M524 290l-24 18" stroke="#242123" stroke-width="5"/></svg>`;
return `<svg class="scene-art" viewBox="0 0 900 360" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><radialGradient id="planet"><stop stop-color="#639daf"/><stop offset=".65" stop-color="#2d647f"/><stop offset="1" stop-color="#142d4a"/></radialGradient><pattern id="stars" width="173" height="119" patternUnits="userSpaceOnUse"><circle cx="15" cy="22" r="1" fill="#aac4db"/><circle cx="104" cy="67" r=".8" fill="#bfdce5"/><circle cx="56" cy="99" r=".6" fill="#aac4db"/></pattern></defs><rect width="900" height="360" fill="#091625"/><rect width="900" height="360" fill="url(#stars)"/><g transform="translate(641 178)"><circle r="133" fill="none" stroke="#548099" opacity=".18"/><circle r="114" fill="none" stroke="#548099" opacity=".32" stroke-dasharray="3 6"/><circle r="95" fill="url(#planet)"/><path d="M-44-83C-64-49-10-57-34-20S9 3 3 33s44 22 21 58A95 95 0 0 0-44-83" fill="#5b8d9e" opacity=".4"/><ellipse rx="180" ry="32" transform="rotate(-27)" fill="none" stroke="#7adfee" opacity=".6"/><ellipse rx="187" ry="35" transform="rotate(-27)" fill="none" stroke="#7adfee" opacity=".16"/><circle cx="150" cy="-75" r="4" fill="#aaf5ff" class="scene-spark"/><path d="M-210 0h50 M160 0h50 M0-150v24 M0 126v24" stroke="#72dfef" opacity=".5"/></g><g stroke="#5f91ac" fill="none" opacity=".5"><path d="M20 65V20h45 M835 20h45v45 M880 295v45h-45 M65 340H20v-45"/><path d="M430 20v320" stroke-dasharray="2 8"/></g><text x="750" y="320" font-family="monospace" font-size="8" fill="#87b3c8">KEPLER / SECTOR 07</text></svg>`}
function portrait(id){const pixel=id==='grove';return `<svg viewBox="0 0 230 190" aria-hidden="true" ${pixel?'shape-rendering="crispEdges"':''}><g fill="none" stroke="currentColor" opacity=".12"><circle cx="115" cy="95" r="72"/><circle cx="115" cy="95" r="58"/><path d="M15 95h200 M115 0v190"/></g>${pixel?'<path d="M59 190v-32h15v-18h24v-17h-9v-15H78V65h12V48h49v12h15v48h-12v18h-10v14h25v17h16v33Z" fill="#131f1c"/><path d="M91 76h49v37h-13v17h-21v-17H91Z" fill="#cbb692"/><path d="M88 67h55v19h-16V75h-16v13H88Z" fill="#233b32"/><path d="M99 97h6v5h-6Z M128 97h6v5h-6Z" fill="#293e34"/><path d="M78 148h20v13h34v-13h21v42H78Z" fill="#607964"/><path d="M99 135h31v12h-10v13h-12v-13h-9Z" fill="#d6c79a"/><path d="M112 163h6v27h-6Z M85 164h13v12H85Z" fill="#b5bb88"/>':'<path d="M50 190c3-41 28-51 49-57v-18h34v18c28 8 48 21 51 57" fill="'+(id==='arcade'?'#ed553b':'#284d65')+'" stroke="'+(id==='arcade'?'#242123':'#79a2b6')+'" stroke-width="3"/><path d="M84 77c0-41 66-42 65 0l-7 29c-9 32-44 32-53 0Z" fill="'+(id==='arcade'?'#eac7a2':'#a8c3ca')+'"/><path d="M78 87c-15-48 26-61 44-52 34-5 45 29 28 58l-12-31-17 18-5-15-25 25 1-18Z" fill="#242b31"/><path d="M100 96h5 M131 96h5" stroke="#242b31" stroke-width="4"/><path d="m108 115 11 2 8-3" fill="none" stroke="#6a655f" stroke-width="2"/><path d="m99 133 18 19 16-19 M117 152v38" fill="none" stroke="'+(id==='arcade'?'#242123':'#79a2b6')+'" stroke-width="3"/><path d="M76 158h14v17H76Z" fill="'+(id==='arcade'?'#edff73':'#72dfef')+'"/>'}</svg>`}
let current=0,person='林澈',page='chat';
function render(i){current=i;person='林澈';page='chat';const t=themes[i];document.querySelectorAll('.selector').forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));document.querySelector('#description').textContent=t.desc;document.querySelector('#preview').innerHTML=`<div class="game" data-theme="${t.id}"><header class="game-head"><div class="game-logo">${t.logo}</div><span class="separator"></span><span class="world-name">${t.world}</span><div class="head-status"><span class="signal"><i class="online"></i>CONNECTED</span><span class="system">YOUR PRIVATE UNIVERSE</span><span class="player">P1 / YOU</span></div></header><nav class="rail" aria-label="游戏导航">${[['chat','对话'],['map','世界'],['bag','记忆'],['quest','任务'],['team','伙伴']].map(([k,v])=>`<button data-page="${k}" class="${k==='chat'?'active':''}" aria-pressed="${k==='chat'}">${icon(k)}<small>${v}</small></button>`).join('')}</nav><section class="center"></section><aside class="right"><section><div class="panel-heading">YOUR COMPANION <b>01 / 03</b></div><div class="character"><div class="portrait">${portrait(t.id)}<span class="corner">${t.id==='arcade'?'PLAYER TWO!':t.id==='orbit'?'CREW / 001':'COMPANION / SR'}</span><span class="serial">YOURCHAR — ORIGINAL</span></div><div class="char-info"><div class="char-name"><span id="char-name">林澈</span><small id="char-en">LIN CHE</small></div><p class="char-desc">${t.role}</p><div class="bond-label"><span>${t.id==='orbit'?'同步率':t.id==='arcade'?'默契值':'羁绊'} / 熟悉的同行者</span><span>72 / 100</span></div><div class="bond">${'<i></i>'.repeat(10)}</div></div></div></section><section class="quest"><div class="panel-heading">SIDE QUEST <b>进行中</b></div><div class="quest-title"><i class="diamond"></i>${t.quest}</div><p>${t.questDesc}</p><div class="quest-progress"><span></span></div><div class="quest-meta"><span>PROGRESS 01 / 03</span><span>日常支线</span></div></section><section class="party"><div class="panel-heading">YOUR PARTY <b>切换伙伴 ↓</b></div><div class="party-buttons">${['林澈','苏晚','Alex'].map((n,j)=>`<button data-person="${n}" class="${j===0?'active':''}"><span class="party-icon">${['澈','晚','A'][j]}</span><span>${n}</span></button>`).join('')}</div></section></aside><footer class="game-foot"><span>● ${t.id==='grove'?'SAVE POINT REACHED':t.id==='arcade'?'NO SCRIPT. JUST YOU.':'ALL SYSTEMS NOMINAL'} / 概念演示</span><span>ENTER 发送　 /　选项推进对话　 /　无真实数据</span><span>YOURCHAR ${t.english}</span></footer></div>`;drawChat();document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>changePerson(b.dataset.person));}
function drawChat(){const t=themes[current];document.querySelector('.center').innerHTML=`<div class="location"><strong>◈ ${t.location}</strong><span>WORLD 01 / LIVE</span></div><div class="scene">${landscape(t.id)}<span class="scene-index">${t.id==='arcade'?'INSERT YOUR PERSONALITY ↙':'A WORLD THAT REMEMBERS YOU'}</span><span class="scene-weather">${t.weather}</span><div class="scene-caption"><div class="chapter">${t.chapter}</div><h2>${t.title}</h2><p>${t.subtitle}</p></div><button class="scene-button">${t.action}</button></div><section class="dialogue"><div class="speaker"><span class="diamond"></span><span id="speaker-name">${person}</span><span class="tag">${t.id==='arcade'?'HAS SOMETHING TO SAY':t.id==='orbit'?'INCOMING TRANSMISSION':'SAYS TO YOU'}</span><time>NOW</time></div><p class="dialogue-copy" aria-live="polite">${t.dialogue}</p><div class="choices">${t.choices.map((v,j)=>`<button data-choice="${j}"><span>0${j+1}</span>${v}</button>`).join('')}</div><form class="inputbar"><span>›</span><input aria-label="输入演示消息" autocomplete="off" placeholder="或者，说出你的台词…"><button type="submit">SEND ↵</button></form></section>`;document.querySelector('.scene-button').onclick=openScene;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{const j=Number(b.dataset.choice);document.querySelector('.dialogue-copy').textContent=j===0?`${person}：好，那就从一件事开始。把你现在最想完成的事情告诉我，我们一起拆成三个小步骤。`:`${person}：好，今天可以不用急着做什么。我在这里。最近有没有一件想和我分享的小事？`;document.querySelectorAll('[data-choice]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));});document.querySelector('.inputbar').onsubmit=e=>{e.preventDefault();const input=document.querySelector('.inputbar input');if(!input.value.trim())return;document.querySelector('.dialogue-copy').textContent=`你：「${input.value.trim()}」\n${person}：收到你的台词啦。这是交互演示，正式版本会在这里接入角色的回复。`;document.querySelector('.dialogue-copy').style.whiteSpace='pre-line';input.value=''};}
function changePerson(n){person=n;document.querySelector('#char-name').textContent=n;document.querySelector('#char-en').textContent=n==='林澈'?'LIN CHE':n==='苏晚'?'SU WAN':'ALEX';document.querySelectorAll('[data-person]').forEach(b=>b.classList.toggle('active',b.dataset.person===n));navigate('chat');document.querySelector('.dialogue-copy').textContent=n==='苏晚'?'苏晚：刚读到一个很喜欢的故事。你想听听，还是先说说你的今天？':n==='Alex'?'Alex：已经就位。今天想推进哪个计划？我们可以从最小的一步开始。':themes[current].dialogue.replace(/<br>/g,' ').replace(/<\/?em>/g,'');}
function openScene(){const t=themes[current];const d=document.querySelector('dialog');d.querySelector('h2').textContent=t.location.split(' / ')[0];d.querySelector('p').textContent=t.modal;d.querySelector('p').style.whiteSpace='pre-line';d.showModal()}
function navigate(key){page=key;document.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('active',key===b.dataset.page);b.setAttribute('aria-pressed',String(key===b.dataset.page))});if(key==='chat'){drawChat();return}const data={map:['世界地图','不是聊天的背景，是你们共同经历过的地方。',[['map','苔原小站','雨后的木屋，一盏灯，和未完的故事。','UNLOCKED / 01'],['star','第七街区','独立书店、地下俱乐部，与即兴发生的日常。','UNLOCKED / 02'],['map','曙光观测舱','在远离喧嚣的地方，接收彼此的信号。','UNLOCKED / 03']]],bag:['记忆背包','共同经历过的小事，成为可以翻看的收藏。',[['leaf','下午的专注时光','你说过，下午最适合安静地读书和写作。','生活偏好 / COMMON'],['star','那个雨天','一段在小站里的闲聊。没做什么，也很开心。','共同经历 / RARE'],['clock','给自己一点空白','再忙，也想留一点没有安排的时间。','重要记忆 / KEEP']]],quest:['支线任务','把日程变成可以推进的小故事。',[['quest',themes[current].quest,themes[current].questDesc,'IN PROGRESS / 1 OF 3'],['leaf','去外面转一圈','离开屏幕二十分钟，看看今天的天空。','OPTIONAL / 日常'],['star','把这一天存下来','写一句今天想记住的话。','OPTIONAL / 记录']]],team:['同行者','各有各的性格，各有各的故事。',[['team','林澈','温柔、有条理。与你慢慢整理生活。','COMPANION / 01'],['team','苏晚','阅读、文字，和那些细微的感受。','COMPANION / 02'],['team','Alex','想法很多，也愿意陪你一步步实现。','COMPANION / 03']]]};const d=data[key];document.querySelector('.center').innerHTML=`<div class="location"><strong>YOURCHAR / ${key.toUpperCase()}</strong><span>DEMO INVENTORY</span></div><section class="inventory"><h2>${d[0]}</h2><p>${d[1]}</p><div class="inventory-grid">${d[2].map(([i,a,b,c])=>`<${key==='team'?'button':'article'} class="item" ${key==='team'?`data-member="${a}"`:''}>${icon(i)}<strong>${a}</strong><p>${b}</p><small>${c}</small></${key==='team'?'button':'article'}>`).join('')}</div></section>`;document.querySelectorAll('[data-member]').forEach(b=>b.onclick=()=>changePerson(b.dataset.member));}
document.querySelector('.selectors').innerHTML=themes.map((t,i)=>`<button class="selector" data-theme-index="${i}" aria-pressed="false"><span class="num">0${i+1}</span><span><strong>${t.name}</strong><small>${t.tag}</small></span><i class="swatch" style="--color:${t.color}"></i></button>`).join('');document.querySelectorAll('[data-theme-index]').forEach(b=>b.onclick=()=>render(Number(b.dataset.themeIndex)));
document.querySelector('#pick').onclick=()=>{let saved=true;try{localStorage.setItem('yourchar-game-design',themes[current].id)}catch{saved=false}const toast=document.querySelector('#toast');toast.textContent=`已选择 ${String(current+1).padStart(2,'0')}「${themes[current].name}」${saved?'，已保存到当前浏览器':'，仅本次有效'}。告诉我编号，我们继续细化。`;toast.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>toast.hidden=true,4500)};render(0);
</script>
