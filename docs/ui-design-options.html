const icon=n=>`<svg aria-hidden="true" viewBox="0 0 24 24"><path d="${paths[n]||paths.spark}"/></svg>`;
let current=0,selected=null;try{selected=localStorage.getItem('yourchar-design-choice')}catch{}
function app(d){return `<div class="app" data-theme="${d.id}"><aside class="sidebar"><div class="app-brand">${icon('leaf')}YourChar<span style="font-size:8px;color:var(--muted);margin-left:auto">BETA</span></div><nav class="nav" aria-label="原型导航">${[['chat','对话','03'],['grid','角色与世界',''],['book','记忆',''],['calendar','日程','']].map(([i,t,n],j)=>`<button data-view="${j}" class="${j?'':'active'}" aria-pressed="${!j}">${icon(i)}${t}<span>${n}</span></button>`).join('')}</nav><div class="section-label">你的伙伴 <span>＋</span></div><button class="person active" data-person="林澈"><span class="avatar">澈</span><span><b>林澈</b><small>我们一起慢慢来。</small></span><i class="dot"></i></button><button class="person" data-person="苏晚"><span class="avatar peach">晚</span><span><b>苏晚</b><small>刚才读到一段很喜欢的话</small></span></button><button class="person" data-person="Alex"><span class="avatar blue">A</span><span><b>Alex</b><small>下一步计划已准备好</small></span></button><div class="section-label">共同的世界 <span>＋</span></div><div class="world-link">${icon('globe')} 城市漫游 <span style="margin-left:auto">↗</span></div><div class="profile"><span class="avatar">Y</span><span>You<small>我的私人空间</small></span>${icon('settings')}</div></aside><section class="chat"><div class="chat-head"><span class="avatar current-avatar">澈</span><div><h2 class="current-name">林澈</h2><small>在线 · 在这里陪你</small></div><div class="head-tools"><span>角色私聊</span>${icon('search')}${icon('more')}</div></div><div class="conversation"><div class="date">9 月 6 日，星期日 · 10:24</div><h2 class="welcome">${d.title}</h2><p class="welcome-sub">${d.sub}</p><div class="message user">最近事情有点多，帮我把下午的安排理一理吧。</div><div class="message assistant"><div class="sender">${icon('spark')}<span class="sender-name">林澈</span><span>10:24</span></div><p>当然。记得你说过，下午是最容易专注的时候。<br>我们留一整块时间给论文，其他事情慢慢排，好吗？</p><div class="task-card"><div class="top"><span>${icon('calendar').replace('<svg','<svg style="width:12px;height:12px;vertical-align:-2px;margin-right:5px"')}今日安排</span><span class="pill">建议计划</span></div><strong>14:00 — 15:30　论文阅读与笔记</strong><small>留出 90 分钟，专注完成一件重要的事。</small></div><p>结束后休息一下，再处理邮件。也给自己留点空白。</p><div class="message-actions">${icon('copy')}${icon('check')}${icon('more')}</div></div></div><div class="composer-wrap"><div class="suggestions"><button>帮我细化一下</button><button>留一点休息时间</button><button>聊点别的</button></div><form class="composer"><textarea aria-label="输入演示消息" rows="2" placeholder="和林澈说点什么…"></textarea><div class="composer-bottom">${icon('plus')}${icon('attach')}<span>私聊空间</span><button type="submit" class="send" aria-label="发送演示消息">${icon('arrow')}</button></div></form><div class="composer-note">你的故事，在这里慢慢延续。 · 交互演示</div></div></section><aside class="context"><div class="context-heading">此刻，与你 ${icon('panel')}</div><div class="character-art"><span>${d.label}</span></div><h3 class="context-name">林澈 <span style="font-size:9px;font-weight:400;color:var(--muted)">LIN CHE</span></h3><div class="bio">温柔而有条理的同行者。<br>陪你整理思绪，也记得生活里的小事。</div><div class="tags"><span>认真倾听</span><span>一起成长</span></div><div class="context-section"><h4>记得关于你 <span>02 条</span></h4><div class="memory">你喜欢在下午安排需要专注的工作。</div><div class="memory">忙碌的时候，也希望留一点自己的时间。</div></div><div class="context-section"><h4>今日节奏 <span>星期日</span></h4><div class="schedule"><time>14:00</time><div>论文阅读<small>建议 · 90 分钟专注时间</small></div></div><div class="schedule"><time>16:00</time><div>散步，给自己充个电<small>建议 · 留一点轻松的时间</small></div></div></div><div class="status"><i class="dot"></i>记忆与日程 · 示例预览</div></aside></div>`}
document.querySelector('.options').innerHTML=designs.map((d,i)=>`<button class="option" data-option="${i}" aria-pressed="false"><span class="option-top"><b>${d.name}</b><span class="swatches">${d.colors.map(c=>`<i style="background:${c}"></i>`).join('')}</span></span><small>${d.tag}</small></button>`).join('');
function render(i){current=i;document.querySelectorAll('[data-option]').forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));document.querySelector('#description').textContent=designs[i].desc;document.querySelector('#preview').innerHTML=app(designs[i]);wire();}
function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.hidden=true,3000)}
function updateSelection(){const d=designs.find(d=>d.id===selected);if(d)document.querySelector('#selection').textContent=`已选择：${d.name} · 可以继续比较或更换`}
function choose(i){selected=designs[i].id;let saved=true;try{localStorage.setItem('yourchar-design-choice',selected)}catch{saved=false}updateSelection();toast(`已选择「${designs[i].name}」${saved?'':'（仅本次有效）'}，把方案字母告诉我即可。`)}
function wire(){const root=document.querySelector('#preview');let name='林澈';const chat=root.querySelector('.chat');const original=chat.innerHTML;
function setupChat(){chat.querySelector('h2.current-name').textContent=name;chat.querySelector('.current-avatar').textContent=name==='Alex'?'A':name.slice(-1);chat.querySelector('.sender-name').textContent=name;chat.querySelector('textarea').placeholder=`和${name}说点什么…`;chat.querySelectorAll('.suggestions button').forEach(b=>b.onclick=()=>{chat.querySelector('textarea').value=b.textContent;chat.querySelector('textarea').focus()});const form=chat.querySelector('form');form.onsubmit=e=>{e.preventDefault();const field=chat.querySelector('textarea');const value=field.value.trim();if(!value)return;const log=chat.querySelector('.conversation');const msg=document.createElement('div');msg.className='message user';msg.textContent=value;log.append(msg);const reply=document.createElement('div');reply.className='message assistant';reply.textContent=`${name} · 已收到。这是界面演示；正式版本将在这里呈现角色的真实回复。`;log.append(reply);field.value='';log.scrollTop=log.scrollHeight};chat.querySelector('textarea').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();form.requestSubmit()}}}
const pages=[null,['角色与世界','让每个伙伴，都有自己的故事。',[['林澈 · 日常同行','温柔、有条理。一起整理思绪与安排日常。'],['苏晚 · 阅读伙伴','分享文字、灵感，以及生活里的细微感受。'],['城市漫游 · 共同世界','旧书店、街角咖啡馆，与尚未发生的故事。']]],['记得的那些小事','让对话有所延续，也让每一份记忆清晰可见。',[['工作习惯','你更喜欢在下午安排需要深度专注的任务。'],['生活偏好','忙碌之余，希望留出散步和独处的时间。'],['与你有关','这里展示记忆列表的视觉样式，全部为示例内容。']]],['为今天，留一点余地','计划可以清晰，也可以从容。',[['14:00 — 15:30 · 论文阅读','建议安排 · 90 分钟专注时间'],['15:30 — 16:00 · 休息与邮件','建议安排 · 给思绪一个缓冲'],['16:00 · 出门散步','建议安排 · 暂时离开屏幕']]]];
function view(i){root.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',Number(b.dataset.view)===i);b.setAttribute('aria-pressed',String(Number(b.dataset.view)===i))});if(!i){chat.innerHTML=original;setupChat();return}const p=pages[i];chat.innerHTML=`<div class="chat-head"><h2>${p[0]}</h2><div class="head-tools">示例预览</div></div><div class="view-panel"><div class="eyebrow">YOUR PERSONAL SPACE</div><h2>${p[0]}</h2><p>${p[1]}</p>${p[2].map(([a,b])=>`<div class="view-item"><strong>${a}</strong><p>${b}</p></div>`).join('')}</div>`}
root.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(Number(b.dataset.view)));root.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{name=b.dataset.person;root.querySelectorAll('[data-person]').forEach(p=>p.classList.toggle('active',p===b));root.querySelector('.context-name').textContent=name;root.querySelector('.bio').textContent=name==='林澈'?'温柔而有条理的同行者。陪你整理思绪，也记得生活里的小事。':name==='苏晚'?'分享文字与灵感的阅读伙伴。一起发现生活里的细微感受。':'清晰务实的协作伙伴。把复杂任务拆成可以行动的下一步。';view(0)});setupChat();}
document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>render(Number(b.dataset.option)));document.querySelector('#choose').onclick=()=>choose(current);
document.querySelector('.comparison').innerHTML=designs.map((d,i)=>`<article><h2>${d.name}</h2><p>${d.desc}</p><div class="mini-window"><iframe title="${d.name}静态缩略预览" tabindex="-1" sandbox style="width:1200px;height:670px;border:0;transform:scale(var(--scale,.5));transform-origin:top left;pointer-events:none"></iframe></div><button class="choose" data-pick="${i}">选择 ${d.name.slice(0,1)} 方案 ↗</button></article>`).join('');
document.querySelectorAll('.mini-window iframe').forEach((frame,i)=>{frame.srcdoc=`<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>${document.querySelector('style').textContent}body{margin:0}.app{border:0;border-radius:0;box-shadow:none}</style><body>${app(designs[i])}</body></html>`});
document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.pick)));
function resize(){document.querySelectorAll('.mini-window').forEach(el=>{const scale=el.clientWidth/1200;el.style.setProperty('--scale',scale);el.style.height=`${670*scale}px`})}
function mode(compare){document.querySelector('.stage').hidden=compare;document.querySelector('.comparison').style.display=compare?'grid':'none';document.querySelector('#single').setAttribute('aria-pressed',String(!compare));document.querySelector('#compare').setAttribute('aria-pressed',String(compare));resize()}
document.querySelector('#single').onclick=()=>mode(false);document.querySelector('#compare').onclick=()=>mode(true);window.addEventListener('resize',resize);render(0);updateSelection();
</script>
</body>
</html>
