function world(t){return `<div class="world" data-id="${t.id}"><header class="world-header"><div class="world-brand">${t.brand}</div><span class="world-id">YOURCHAR / ${t.en}</span><span class="live"><i></i>PRIVATE CONNECTION</span><span class="profile">Y</span></header><nav class="rail" aria-label="原型导航">${[['chat','对话'],['world','场景'],['memory','记忆'],['schedule','日程'],['people','伙伴']].map(([k,n])=>`<button data-page="${k}" class="${k==='chat'?'active':''}" aria-pressed="${k==='chat'}">${icon(k)}<small>${n}</small></button>`).join('')}<span class="rail-mark">A PLACE FOR YOU</span></nav><section class="place">${scene(t)}<div class="place-top"><span>${t.place}</span><span>${t.status}</span></div><div class="scene-label"><div class="overline">${t.en}</div><h2>${t.title}</h2><p>${t.sub}</p></div><div class="place-info"><span class="record">${icon(t.id==='radio'?'music':t.id==='greenhouse'?'leaf':'star')}</span><div><strong>${t.record}</strong><small>${t.recordSub}</small></div><button class="enter">${t.enter} ↗</button></div></section><section class="chat"><div class="companion"><span class="avatar">澈</span><div><h3 class="person-name">林澈</h3><small class="person-role">${t.role}</small></div><span class="badge">${t.badge}</span></div><div class="log"><div class="time">${t.time}</div><div class="narration">${t.narration}</div><div class="message-label">林澈 · 对你说</div><p class="message-text">${t.message}</p><div class="memory-card">${icon('memory')}<div><strong>${t.memory}</strong><small>${t.memorySub}</small></div><span class="arrow">↗</span></div></div><div class="choices">${t.choices.map((n,i)=>`<button data-choice="${i}">${n} ↗</button>`).join('')}</div><form class="composer"><span style="color:var(--muted);font-size:15px">＋</span><input aria-label="输入演示消息" placeholder="说点什么，让故事继续…" autocomplete="off"><button aria-label="发送演示消息">↗</button></form><div class="composer-note"><span>此刻，只有你们。</span><span>交互演示 / ENTER 发送</span></div></section><footer class="world-footer"><span>YOURCHAR / ${t.id.toUpperCase()}</span><span>SHARED MOMENTS, QUIETLY KEPT.</span><span>CONCEPT ${String(themes.indexOf(t)+1).padStart(2,'0')} / 09</span></footer></div>`}
let current=0,person='林澈',saved=new Set();try{const value=JSON.parse(localStorage.getItem('yourchar-nine-shortlist')||'[]');if(Array.isArray(value))saved=new Set(value.filter(id=>themes.some(t=>t.id===id)))}catch{}
function render(i){current=i;person='林澈';const t=themes[i];document.querySelector('#preview').innerHTML=world(t);document.querySelector('#description').textContent=t.desc;document.querySelectorAll('.tab').forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));const root=document.querySelector('#preview');const chat=root.querySelector('.chat');const original=chat.innerHTML;root.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page,original));root.querySelector('.enter').onclick=()=>openPlace();wireChat();updateSaved()}
function wireChat(){const root=document.querySelector('#preview');root.querySelector('.person-name').textContent=person;root.querySelector('.avatar').textContent=person==='Alex'?'A':person.slice(-1);root.querySelector('.message-label').textContent=`${person} · 对你说`;if(person!=='林澈'){root.querySelector('.person-role').textContent=person==='苏晚'?'一起收藏文字与日常的伙伴':'一起整理想法与计划的伙伴';root.querySelector('.narration').textContent=`${person}已经来到这里，向你打了个招呼。`;root.querySelector('.message-text').textContent=person==='苏晚'?'刚读到一段很喜欢的话，想和你分享。不过先说说你吧，今天怎么样？':'我在。今天有没有一件想一起推进的事？也可以先随意聊聊。'}root.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{append('user',b.textContent.replace(' ↗',''));append('assistant',Number(b.dataset.choice)===0?`${person}：好，我听着。就从你此刻最想说的那一件事开始吧。`:`${person}：好，我们可以慢一点。这里的时间不用安排得那么满。`)});root.querySelector('form.composer').onsubmit=e=>{e.preventDefault();const input=root.querySelector('input');if(!input.value.trim())return;append('user',input.value.trim());append('assistant',`${person}：收到。这是界面演示；正式接入后，角色会结合你们的对话与记忆继续回应。`);input.value=''};}
function append(role,text){const log=document.querySelector('#preview .log'),p=document.createElement('p');p.className=`message-text ${role}`;p.textContent=text;log.append(p);log.scrollTop=log.scrollHeight;}
function navigate(key,original){const root=document.querySelector('#preview'),t=themes[current];root.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===key);b.setAttribute('aria-pressed',String(b.dataset.page===key))});root.querySelector('.content-panel')?.remove();root.querySelector('.place').hidden=key!=='chat';root.querySelector('.chat').hidden=key!=='chat';if(key==='chat'){root.querySelector('.chat').innerHTML=original;wireChat();return}const data={world:['场景里的故事','每个地方，都可以成为共同经历的一部分。',[['world',t.enter,t.sub,'ENTER SCENE'],['star','你们的共同经历','那些发生过的日常，在这里慢慢积累。','SHARED MOMENTS'],['memory','场所手记',t.narration,'PLACE NOTES']]],memory:['被记住的小事','让陪伴有连续的记忆，也保留随时查看与整理的空间。',[['memory',t.memory,t.memorySub,'SHARED MEMORY'],['leaf','安静的陪伴','你希望有些时候，不必急着提出问题或得到答案。','PERSONAL PREFERENCE'],['star','一次新的尝试','记得为还没成形的想法，留一点空间。','A SMALL PROMISE']]],schedule:['留给生活的空白','安排可以清晰，也可以给心情留一点余地。',[['schedule','14:00 · 专注时间','建议安排：留一段完整的时间给最重要的事。','PROPOSED / 90 MIN'],['leaf','16:00 · 去外面走走','建议安排：离开屏幕，看看今天的天空。','PROPOSED / 20 MIN'],['memory','21:00 · 记录今天','建议安排：写下今天想记住的一句话。','PROPOSED / 10 MIN']]],people:['此刻的同行者','在同一个世界里，与不同的伙伴继续故事。',[['people','林澈',t.role,'LIN CHE'],['people','苏晚','文字、灵感，以及生活里的细微感受。','SU WAN'],['people','Alex','一起把想法整理成可以尝试的下一步。','ALEX']]]};const d=data[key];const panel=document.createElement('section');panel.className='content-panel';panel.innerHTML=`<div class="kicker">${t.en}</div><h2>${d[0]}</h2><p>${d[1]}</p><div class="records">${d[2].map(([i,n,desc,label],j)=>`<${key==='people'||key==='world'&&j===0?'button':'article'} class="record-card" ${key==='people'?`data-person="${n}"`:key==='world'&&j===0?'data-open-place':''}>${icon(i)}<h3>${n}</h3><p>${desc}</p><small>${label}</small></${key==='people'||key==='world'&&j===0?'button':'article'}>`).join('')}</div>`;root.querySelector('.world').append(panel);panel.querySelector('[data-open-place]')?.addEventListener('click',openPlace);panel.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{person=b.dataset.person;navigate('chat',original)})}
function openPlace(){const t=themes[current],d=document.querySelector('dialog');d.querySelector('h2').textContent=t.name;d.querySelector('p').textContent=t.modal;d.showModal()}
function updateSaved(){const names=themes.filter(t=>saved.has(t.id)).map(t=>`${String(themes.indexOf(t)+1).padStart(2,'0')} ${t.name}`);document.querySelector('#shortlist').textContent=names.length?`候选：${names.join(' · ')}`:'可收藏多个方向，再一起确定最终设计。';const f=document.querySelector('#favorite');f.textContent=saved.has(themes[current].id)?'✓ 已加入候选':'＋ 加入候选';f.setAttribute('aria-pressed',String(saved.has(themes[current].id)));document.querySelectorAll('[data-save]').forEach(b=>{const active=saved.has(themes[Number(b.dataset.save)].id);b.textContent=active?'✓ 已收藏':'＋ 收藏';b.classList.toggle('starred',active);b.setAttribute('aria-pressed',String(active))})}
function toggleSave(i){const id=themes[i].id;if(saved.has(id))saved.delete(id);else saved.add(id);let stored=true;try{localStorage.setItem('yourchar-nine-shortlist',JSON.stringify([...saved]))}catch{stored=false}updateSaved();const toast=document.querySelector('#toast');toast.textContent=`${themes[i].name}${saved.has(id)?'已加入候选':'已移出候选'}${stored?'':'（仅本次有效）'}`;toast.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>toast.hidden=true,2200)}
document.querySelector('.tabs').innerHTML=themes.map((t,i)=>`<button class="tab" data-index="${i}" aria-pressed="false"><span>${String(i+1).padStart(2,'0')}</span><b>${t.name}</b></button>`).join('');document.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>{render(Number(b.dataset.index));setMode(false)});document.querySelector('#favorite').onclick=()=>toggleSave(current);
let overviewBuilt=false;function buildOverview(){if(overviewBuilt)return;overviewBuilt=true;const el=document.querySelector('.overview');el.innerHTML=themes.map((t,i)=>`<article><div class="thumbnail"><iframe sandbox tabindex="-1" title="${t.name}静态预览"></iframe></div><div class="overview-head"><h2>${String(i+1).padStart(2,'0')} · ${t.name}</h2><span class="overview-tag">YOURCHAR</span></div><p>${t.tag}</p><div class="overview-actions"><button data-preview="${i}">进入预览 ↗</button><button data-save="${i}" aria-pressed="false">＋ 收藏</button></div></article>`).join('');el.querySelectorAll('iframe').forEach((frame,i)=>frame.srcdoc=`<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>${document.querySelector('style').textContent}body{margin:0}.world{height:720px;border:0;box-shadow:none}</style><body>${world(themes[i])}</body></html>`);el.querySelectorAll('[data-preview]').forEach(b=>b.onclick=()=>{render(Number(b.dataset.preview));setMode(false);document.querySelector('.meta').scrollIntoView({block:'start',behavior:'instant'})});el.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>toggleSave(Number(b.dataset.save)));updateSaved()}
function resize(){document.querySelectorAll('.thumbnail').forEach(el=>{const scale=el.clientWidth/1200;el.style.setProperty('--scale',scale);el.style.height=`${720*scale}px`})}
function setMode(overview){if(overview)buildOverview();document.querySelector('#detail').hidden=overview;document.querySelector('.overview').style.display=overview?'grid':'none';document.querySelector('#detail-mode').setAttribute('aria-pressed',String(!overview));document.querySelector('#overview-mode').setAttribute('aria-pressed',String(overview));resize()}
document.querySelector('#detail-mode').onclick=()=>setMode(false);document.querySelector('#overview-mode').onclick=()=>setMode(true);window.addEventListener('resize',resize);render(0);
</script>
</body>
</html>
