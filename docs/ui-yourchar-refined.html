function renderSessions(){let html='';for(const [group,label,k,items] of [['private','角色私聊','chat',sessions.filter(s=>s.type==='private')],['world','世界会话','world',sessions.filter(s=>s.type==='world')]]){const matches=items.filter(s=>`${s.name} ${s.preview}`.toLowerCase().includes(search.toLowerCase()));if(!matches.length)continue;html+=`<button class="group-label" data-group="${group}" aria-expanded="${!closedGroups.has(group)}">${icon(closedGroups.has(group)?'right':'down')}${label}<span class="total">${group==='world'?'1 个世界':matches.length}</span></button><div ${closedGroups.has(group)?'hidden':''}>`;for(const s of matches){if(s.id==='interaction'){html+=`<button class="nested-session ${current.id===s.id?'active':''}" data-session="${s.id}">${icon('people')}<span>${escapeHTML(s.name)}<small>交流中 · 那我们下次一起翻翻。</small></span></button>`;continue}html+=`<button class="session ${current.id===s.id?'active':''}" data-session="${s.id}" aria-current="${current.id===s.id?'true':'false'}"><span class="avatar ${s.color}">${s.type==='world'?icon('world'):s.initial}</span><span class="session-copy"><span class="session-title"><b>${escapeHTML(s.name)}</b><time>${s.time}</time></span><span class="session-preview">${escapeHTML(s.preview)}</span></span>${s.id==='su'?'<i class="unread"></i>':''}</button>`}html+='</div>'}document.querySelector('#sessions').innerHTML=html||'<div class="empty">没有找到相关会话。</div>';}

function initialMessages(){if(current.type==='world')return worldMessages();if(current.id==='lin')return `<div class="date-separator">今天，9 月 6 日 · 10:21</div>${message('assistant','早上好。今天想先做点什么？<br>我记得你说过，下午比较适合安静地读论文。','10:21')}${message('user','嗯，下午先读论文吧。三点半提醒我起来走走，别一坐就是一下午。','10:23')}${message('assistant','好，下午三点半我会提醒你。<br>先安心读一会儿，也给自己留一点休息的时间。','10:24',`<details class="tool-progress"><summary>${icon('check')}已完成 2 个步骤${icon('right','chev')}</summary><div class="tool-steps">已读取当前时间与日程<br>已创建 15:30 提醒<br><span>以上为执行过程样式演示。</span></div></details><div class="reminder"><div class="reminder-top">${icon('calendar')}今日提醒<span>演示 · 已安排</span></div><strong>15:30　起来走走，休息一下</strong><p>下午的专注时间，也留一点给自己。</p></div><div class="message-feedback"><button data-feedback="copy" aria-label="复制消息">${icon('copy')}</button><button data-feedback="heart" aria-label="喜欢这条消息">${icon('heart')}</button></div>`)}<div class="continuity">${icon('memory')}记得你的习惯，也陪你过好今天。</div>`;return `<div class="date-separator">今天 · ${current.time}</div>${message('assistant',current.id==='su'?'刚读到一句很喜欢的话：有些日子不用特别精彩，安静地过完也很好。<br>你今天怎么样？':'我在。你可以先把脑海里的想法说出来，不用一次想清楚。<br>我们一起找到最值得推进的下一步。',current.time)}${message('user',current.id==='su'?'这句话还挺适合今天的。最近有点想慢下来。':'想把这周的研究任务重新梳理一下。',current.time)}${message('assistant',current.id==='su'?'那就慢一点。可以先从一件小事开始：泡杯茶，读几页书，或者只是在这里聊会儿。':'可以。先列出本周最重要的一个目标，再看看哪些事情可以往后放。我们从目标开始。',current.time)}`}
function worldMessages(){return `<div class="date-separator">青岚市 · 第 12 次共同经历</div><div class="world-scene"><div class="scene-intro"><span class="avatar city">${icon('world')}</span><div><h2>街角书店</h2><p>一场小雨，把午后的脚步放慢了。</p></div><button class="icon-btn" data-action="scene" aria-label="查看场景信息">${icon('info')}</button></div><div class="scene-meta"><span>午后 14:10 · 小雨</span><span>在场：林澈、苏晚</span></div><div class="scene-copy"><p>推开书店的玻璃门，檐下的风铃轻轻响了一声。雨水还顺着窗沿往下滑，店里有旧纸页和刚煮好咖啡的气味。</p><p>林澈把伞收好，靠在门边。苏晚已经在靠窗的书架前，指尖停在一本浅灰色的书脊上。</p></div><div class="scene-line"><span class="avatar pink">晚</span><div><strong>苏晚</strong><p>“就是这本。上次想和你们说的，开头有一句话特别好。”</p></div></div><div class="scene-copy"><p>她把书抽出来，翻到折了角的那一页，转向你。窗外的雨声恰好在这时变轻了一点。</p></div><div class="scene-line"><span class="avatar">澈</span><div><strong>林澈</strong><p>“不急，坐下来慢慢看。今天应该还会下很久。”</p></div></div><div class="scene-end">${icon('memory')}世界记录已更新 · 演示<span style="margin-left:auto">轮到你继续这个场景</span></div></div>`}
function selectSession(id){drafts[current.id]=document.querySelector('#input').value;current=sessions.find(s=>s.id===id)||sessions[0];privateMode=false;incognito=false;document.querySelector('#notice').hidden=true;document.querySelector('#session-menu').hidden=true;document.querySelector('#more').setAttribute('aria-expanded','false');setPage('chat');document.querySelector('#app').classList.remove('list-open');document.querySelector('#header-name').textContent=current.name;document.querySelector('#header-mode').textContent=current.type==='world'?'世界演绎':'角色私聊';document.querySelector('#header-sub').textContent=current.sub;const av=document.querySelector('#header-avatar');av.className=`avatar ${current.color}`;av.innerHTML=current.type==='world'?icon('world'):current.initial;document.querySelector('#messages').innerHTML=initialMessages();for(const m of histories[id]||[])appendMessage(m.role,m.text,false);document.querySelector('#input').value=drafts[id]||'';document.querySelector('#input').placeholder=current.type==='world'?'推动世界中的下一幕…':`对${current.name}说点什么…`;document.querySelector('#composer-hint').textContent=current.type==='world'?'世界演绎 · 推进场景':'角色私聊';document.querySelector('#composer-note').textContent=current.type==='world'?'故事会继续，你也是其中的一部分。':'每一段日常，都可以接着聊。';document.querySelector('#meet').setAttribute('aria-label',current.type==='world'?'查看场景信息':'发起见面');document.querySelector('#messages').scrollTop=0;attached=[];renderAttachments();renderSessions();renderDrawer();}
function renderDrawer(){document.querySelector('#drawer').innerHTML=`<div class="drawer-head">${current.type==='world'?'世界资料':'角色资料'}<button class="icon-btn" id="close-drawer" aria-label="关闭资料">${icon('close')}</button></div><div class="profile-summary"><div class="avatar ${current.color}">${current.type==='world'?icon('world'):current.initial}</div><h2>${escapeHTML(current.name)}</h2><p>${escapeHTML(current.sub)}</p><div class="profile-tags"><span>${current.type==='world'?'共同世界':'日常同行'}</span><span>${current.type==='world'?'互动演绎':'长期记忆'}</span></div></div><section class="drawer-section"><h3>${current.type==='world'?'此刻的场景':'记得关于你'}<button data-nav="management">查看</button></h3><p>${current.type==='world'?'街角书店，小雨。林澈与苏晚在场。':'你喜欢在下午安排需要深度专注的工作。'}</p><p>${current.type==='world'?'书页、咖啡，与还没说完的那句话。':'忙碌的时候，也希望有人提醒自己休息。'}</p></section><section class="drawer-section"><h3>${current.type==='world'?'在场角色':'今日安排'}</h3><p>${current.type==='world'?'林澈 · 门边的旅伴':'15:30　起来走走，休息一下'}</p><p>${current.type==='world'?'苏晚 · 正在翻阅一本书':'日程与提醒均为示例数据。'}</p></section><section class="drawer-section"><h3>能力</h3><div class="capability">${icon('memory')}长期记忆<span>已启用</span></div><div class="capability">${icon('calendar')}日程与提醒<span>已启用</span></div></section>`;document.querySelector('#close-drawer').onclick=()=>toggleDrawer(false)}
function toggleDrawer(force){const drawer=document.querySelector('#drawer');const open=typeof force==='boolean'?force:drawer.hidden;drawer.hidden=!open;document.querySelector('#info').setAttribute('aria-expanded',String(open))}
function appendMessage(role,text,save=true){const el=document.createElement('div');el.innerHTML=message(role,escapeHTML(text).replace(/\n/g,'<br>'),'现在');document.querySelector('#messages').append(el.firstElementChild);if(save)(histories[current.id]??=[]).push({role,text})}
function send(){const input=document.querySelector('#input'),text=input.value.trim();if(!text&&!attached.length)return;appendMessage('user',(text||'分享附件')+(attached.length?'\n附件：'+attached.map(f=>f.name).join('、'):''));appendMessage('assistant',current.type==='world'?'你继续了这个场景。这是界面演示；正式版本会由世界模型接续叙事。':`我收到啦。这是 ${current.name} 的界面演示；正式版本会结合角色记忆继续回复。`);input.value='';drafts[current.id]='';attached=[];renderAttachments();document.querySelector('#messages').scrollTop=document.querySelector('#messages').scrollHeight;}
function renderAttachments(){document.querySelector('#attachments').innerHTML=attached.map((f,i)=>`<div class="attachment-chip"><span>${escapeHTML(f.name)}</span><button data-remove="${i}" aria-label="移除附件">×</button></div>`).join('')}
function showDialog(title,html){document.querySelector('#dialog-content').innerHTML=`<h2>${title}</h2>${html}`;document.querySelector('#dialog').showModal()}
function toast(text){const el=document.querySelector('#toast');el.textContent=text;el.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.hidden=true,2600)}
function setPage(id){page=id;document.querySelectorAll('[data-nav]').forEach(b=>{b.classList.toggle('active',b.dataset.nav===id);b.setAttribute('aria-current',b.dataset.nav===id?'page':'false')});document.querySelector('.conversations').hidden=id!=='chat';document.querySelector('.thread').hidden=id!=='chat';document.querySelector('#page').hidden=id==='chat';document.querySelector('#app').classList.remove('list-open');if(id==='chat')return;const el=document.querySelector('#page');const titles={calendar:['日程','你的安排与角色的日常，在这里分别管理。'],characters:['角色与世界','私聊身份、共同世界与持续的关系。'],management:['管理','记忆、能力和工作空间，按需要展开。'],settings:['设置','在熟悉的结构里，调整模型、外观与会话偏好。'],debug:['Debug','运行状态与执行信息。此处为视觉原型示例。']};const [title,sub]=titles[id];let content='';if(id==='characters'){content=`<div class="page-tabs"><button class="active" data-library="private">角色卡</button><button data-library="world">世界卡</button></div><div class="cards" id="character-cards"></div>`}else if(id==='calendar'){content=`<div class="page-tabs"><button class="active" data-calendar="user">用户日程</button><button data-calendar="character">角色日程</button></div><div class="rows" id="calendar-rows"></div>`}else {const rows=id==='management'?[['memory','记忆管理','全局记忆、角色记忆与共同经历。','示例 12 条'],['blocks','MCP 与 Skills','查看当前角色可用的能力与工作方法。','示例 4 项'],['archive','工作空间','文档、附件和项目文件。','示例 3 项']]:id==='settings'?[['settings','模型设置','模型来源与角色路由，沿用当前产品的配置逻辑。','查看'],['moon','界面外观','浅色与深色，柔玫瑰、松石绿与雾蓝强调色。','切换'],['lock','隐私与会话','私密、无痕与归档会话的设置入口。','查看']]:[['activity','主会话','当前会话运行正常。','就绪'],['gauge','上下文用量','已使用 24%，剩余 76%。','示例'],['check','最近一次执行','时间读取与提醒创建均已完成。','2 步']];content=`<div class="rows">${rows.map(([k,n,s,state])=>`<div class="row">${icon(k)}<div><h3>${n}</h3><p>${s}</p></div>${id==='settings'?`<button data-setting="${k}">${state}</button>`:`<span class="row-status">${state}</span>`}</div>`).join('')}</div>`}el.innerHTML=`<h1>${title}</h1><p>${sub}</p>${content}`;if(id==='characters')renderCharacterCards('private');if(id==='calendar')renderCalendar('user');}
function renderCharacterCards(type){document.querySelector('#character-cards').innerHTML=sessions.filter(s=>s.type===type&&s.id!=='interaction').map(s=>`<button class="card" data-session="${s.id}"><div class="avatar ${s.color}">${s.type==='world'?icon('world'):s.initial}</div><h2>${escapeHTML(s.name)}</h2><p>${s.sub}</p><small>${type==='world'?'进入世界':'打开私聊'} ↗</small></button>`).join('');}
function renderCalendar(owner){document.querySelector('#calendar-rows').innerHTML=(owner==='user'?[['14:00','论文阅读与笔记','建议安排 · 90 分钟专注时间'],['15:30','起来走走，休息一下','已安排样式演示 · 来自与林澈的私聊']]:[['09:00','林澈 · 整理今日计划','角色日常 · 示例'],['14:00','苏晚 · 去街角书店','世界日常 · 示例']]).map(([time,n,s])=>`<div class="row"><time>${time}</time>${icon('calendar')}<div><h3>${n}</h3><p>${s}</p></div></div>`).join('')}
function action(type){document.querySelector('#session-menu').hidden=true;document.querySelector('#more').setAttribute('aria-expanded','false');if(type==='private'||type==='incognito'){if(type==='private')privateMode=!privateMode;else incognito=!incognito;const text=incognito?'无痕模式样式预览 · 本文件未实现无痕存储或隐私隔离。':privateMode?'私密模式样式预览 · 本文件未实现访问控制或数据隔离。':'';document.querySelector('#notice').textContent=text;document.querySelector('#notice').hidden=!text;return}if(type==='rename'){showDialog('重命名会话','<p>仅修改本次预览中的会话名称。</p><form id="rename-form"><input id="rename-input" aria-label="会话名称" maxlength="40"><button class="primary" type="submit">保存名称</button></form><p></p>');document.querySelector('#rename-input').value=current.name;document.querySelector('#rename-form').onsubmit=e=>{e.preventDefault();const name=document.querySelector('#rename-input').value.trim();if(name){current.name=name;document.querySelector('#dialog').close();selectSession(current.id)}};return}if(type==='archive'){toast('归档操作入口演示，不会删除或归档真实会话。');return}showDialog('场景信息','<p><b>世界：</b>青岚市<br><b>地点：</b>街角书店<br><b>时间：</b>午后 14:10，小雨<br><b>在场：</b>林澈、苏晚</p><p>世界演绎通过场景与角色互动建立代入感，延续现有产品的叙事结构。</p>')}
function theme(){document.body.classList.toggle('dark');saveAppearance()}
function saveAppearance(){try{localStorage.setItem('yourchar-refined-appearance',JSON.stringify({dark:document.body.classList.contains('dark'),color:document.body.dataset.color||'rose'}))}catch{}}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){if(nav.dataset.nav==='chat'&&page==='chat'&&matchMedia('(max-width:600px)').matches)document.querySelector('#app').classList.toggle('list-open');else setPage(nav.dataset.nav);return}const session=e.target.closest('[data-session]');if(session){selectSession(session.dataset.session);return}const group=e.target.closest('[data-group]');if(group){closedGroups.has(group.dataset.group)?closedGroups.delete(group.dataset.group):closedGroups.add(group.dataset.group);renderSessions();return}const a=e.target.closest('[data-action]');if(a){action(a.dataset.action);return}const color=e.target.closest('[data-color]');if(color){document.body.dataset.color=color.dataset.color;document.querySelectorAll('[data-color]').forEach(b=>b.setAttribute('aria-pressed',String(b===color)));saveAppearance();return}const remove=e.target.closest('[data-remove]');if(remove){attached.splice(Number(remove.dataset.remove),1);renderAttachments();return}const tab=e.target.closest('[data-library],[data-calendar]');if(tab){tab.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===tab));if(tab.dataset.library)renderCharacterCards(tab.dataset.library);else renderCalendar(tab.dataset.calendar);return}const setting=e.target.closest('[data-setting]');if(setting){if(setting.dataset.setting==='moon')theme();else showDialog('设置预览','<p>这里保留现有产品的配置入口。此原型展示布局与交互，不会更改真实设置。</p>');return}const feedback=e.target.closest('[data-feedback]');if(feedback){if(feedback.dataset.feedback==='heart'){feedback.style.color='var(--accent)';toast('已标记喜欢 · 本次演示')}else{const text=feedback.closest('.message-content').querySelector('.bubble').innerText;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>toast('消息已复制')).catch(()=>toast('浏览器未允许复制，请选择消息文字手动复制。'));else toast('请选择消息文字手动复制。')}return}if(!e.target.closest('#more,#session-menu')){document.querySelector('#session-menu').hidden=true;document.querySelector('#more').setAttribute('aria-expanded','false')}});
document.querySelector('#search').oninput=e=>{search=e.target.value;renderSessions()};document.querySelector('#info').onclick=()=>toggleDrawer();document.querySelector('#header-avatar').onclick=()=>toggleDrawer();document.querySelector('#more').onclick=()=>{const menu=document.querySelector('#session-menu');menu.hidden=!menu.hidden;document.querySelector('#more').setAttribute('aria-expanded',String(!menu.hidden))};document.querySelector('#meet').onclick=()=>{if(current.type==='world')action('scene');else showDialog('发起见面','<p>将当前角色带入一个共同场景，开始现场互动。</p><div class="rows"><button class="row" id="enter-world" style="width:100%;text-align:left">'+icon('world')+'<div><h3>青岚市 · 街角书店</h3><p>点击进入世界演绎示例</p></div></button></div><p></p>');document.querySelector('#enter-world')?.addEventListener('click',()=>{document.querySelector('#dialog').close();selectSession('world')})};document.querySelector('#context').onclick=()=>showDialog('上下文余量','<div class="metric">24% <span style="font-size:12px;color:var(--muted);font-weight:400">已使用</span></div><div class="meter"><span></span></div><p>示例：已使用约 31K / 128K tokens。<br>按需展开技术信息，主界面保持简洁。</p>');document.querySelector('#composer').onsubmit=e=>{e.preventDefault();send()};document.querySelector('#input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}};document.querySelector('#attach').onclick=()=>document.querySelector('#files').click();document.querySelector('#files').onchange=e=>{attached.push(...e.target.files);renderAttachments();e.target.value=''};document.querySelector('#emoji').onclick=()=>{const input=document.querySelector('#input');input.value+=' 🙂';input.focus()};document.querySelector('#theme-toggle').onclick=theme;document.querySelector('#rail-theme').onclick=theme;document.querySelector('#back-list').onclick=()=>document.querySelector('#app').classList.add('list-open');document.querySelector('#archive-list').onclick=()=>showDialog('归档会话','<p>暂时没有归档的示例会话。正式产品可以从这里恢复归档对话。</p>');document.querySelector('#new-chat').onclick=()=>{setPage('characters')};document.querySelector('#prototype-info').onclick=()=>showDialog('在 YourChar 上精修','<p>保留：功能窄栏、世界/角色分组会话、聊天正文、见面、执行进度、上下文余量与管理入口。</p><p>优化：银灰层次、克制强调色、统一圆角和线性图标、更舒展的消息间距与输入区。角色资料按需侧滑展开。</p><p>这是独立 HTML 原型，未修改现有应用，也没有接入真实角色或模型。</p>');document.addEventListener('keydown',e=>{if(e.key==='Escape'){toggleDrawer(false);document.querySelector('#session-menu').hidden=true;document.querySelector('#more').setAttribute('aria-expanded','false')}});try{const pref=JSON.parse(localStorage.getItem('yourchar-refined-appearance')||'{}');if(pref.dark)document.body.classList.add('dark');if(['rose','sage','blue'].includes(pref.color)){document.body.dataset.color=pref.color;document.querySelectorAll('[data-color]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.color===pref.color)))}}catch{}fillIcons();selectSession('lin');
</script>
